name: Supabase wachhalten

# Supabase pausiert Free-Tier-Projekte nach 7 Tagen ohne Anfrage.
# Eine Anfrage pro Tag reichte nicht (erneute Warnung im Nov. 2026),
# Supabase verlangt "a few user requests each day". Daher alle 4 Stunden.
# Secrets: SUPABASE_URL, SUPABASE_ANON_KEY.

on:
  schedule:
    - cron: "17 */4 * * *"   # alle 4 Stunden
  workflow_dispatch:        # erlaubt manuelles Ausloesen im Actions-Tab

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Leseanfrage an Supabase
        run: |
          curl --fail --silent --show-error \
            "${SUPABASE_URL%/}/rest/v1/games?select=id&limit=1" \
            -H "apikey: $SUPABASE_ANON_KEY"
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
